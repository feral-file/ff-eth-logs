version: "2"

# ================
# Core run options
# ================
run:
  go: "1.25"          # minimum Go version your project supports
  timeout: 10m        # timeout for the linting process
  concurrency: 4      # parallelism (optional – default is auto‑detected)

# =================
# Code formatters
# =================
formatters:
  enable:
    - goimports        # keeps import blocks ordered & grouped
  exclusions:
    paths:
      - internal/mocks   # generated by mockgen; CI checks them against `go generate`, not goimports
  settings:
    goimports:
      # change to your project’s import path(s)
      local-prefixes:
        - github.com/feral-file/ff-eth-logs

# =========
# Linters
# =========
linters:
  # v2 replaces the old "disable-all: true" with this:
  default: none        # start from an empty set and opt‑in
  enable:
    # Bugs / correctness
    - govet
    - staticcheck      # includes old gosimple & stylecheck bundles
    - errcheck
    - ineffassign
    - unused

    # Error‑handling hints
    - errorlint
    - errname

    # Security
    - gosec

    # Style / spelling
    - misspell
  settings:
    misspell:
      locale: US       # US or UK spelling dictionary
      ignore-rules:
        - MONITORD

# ==========
# Issues UI
# ==========
issues:
  max-issues-per-linter: 0   # keep unlimited, as before
  max-same-issues: 0         # …
  # Whole-repository linting on every run. A diff-only mode (new-from-merge-base)
  # needs a resolvable base ref on every checkout (a detached pull_request
  # checkout has origin/main, not main) and silently reports nothing on pushes
  # to the base branch itself; the repository lints clean in full, so there is
  # no reason to narrow the scope.
  new: false


# ==========
# CLI output
# ==========
output:
  formats:
    text:
      print-issued-lines: true  # show offending code lines
